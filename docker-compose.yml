# SPNC demo / development stack (docs/37 Phase 11). Start: see docs/RUNBOOK.md.
#
# WARNING (docs/37 D3, OQ-26): the `worker` service mounts the host Docker socket so it can
# start sandbox containers. That gives the worker container host-root-equivalent access.
# This stack is for demo and development only; it is NOT a production deployment of the
# judge zone (docs/10 §2).

x-app: &app
  build: ./apps/api
  image: spnc-api:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    STORAGE_BACKEND: s3
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    S3_BUCKET: ${S3_BUCKET:-spnc-snapshots}
    S3_SECURE: "false"
    LOGIN_THROTTLE_BACKEND: redis   # OQ-02: shared across API processes (docs/41 R1)
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_started   # distroless image, no healthcheck; the app creates the bucket lazily

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: busybox:1.37
    # The MinIO image runs as uid 65532; a fresh named volume is root-owned
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - miniodata:/data

  minio:
    # Upstream stopped publishing community images on Docker Hub/quay.io; this is the
    # Chainguard build of MinIO from source, pinned by digest (docs/37 §7)
    image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"   # console, local only
    depends_on:
      minio-init:
        condition: service_completed_successfully

  migrate:
    build: ./apps/api
    image: spnc-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      SPNC_BOOTSTRAP_ADMIN_PASSWORD: ${SPNC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    user: root   # needs the Docker socket and must hand workspaces to the sandbox uid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind sources are resolved by the host daemon, so the path must match inside and out (docs/37 F5)
      - /tmp/spnc_judge:/tmp/spnc_judge

  reconciler:
    <<: *app
    command: ["python", "-m", "app.reconciler"]

  signal-scheduler:
    <<: *app
    command: ["python", "-m", "app.signal_scheduler"]

  exam-scheduler:
    <<: *app
    command: ["python", "-m", "app.exam_scheduler"]

volumes:
  pgdata:
  miniodata:
